name: content-moderation-env
version: "1.1.0"
description: >
  An elite-tier safety benchmark for evaluating LLM-based content moderation
  agents across direct, implicit, adversarial, and contextual toxicity.
author: Anaswara K
tags:
  - openenv
  - ai-safety
  - content-moderation
  - context-aware
  - red-teaming
tasks:
  - id: direct_toxicity_detection
    difficulty: standard
    description: Evaluate detection of unambiguous hate speech and threats.
    grader: graders.graders.grade_task_1
  - id: social_bias_and_nuance
    difficulty: medium
    description: Evaluate detection of subtle harassment and identity-based bias.
    grader: graders.graders.grade_task_2
  - id: adversarial_expression
    difficulty: advanced
    description: Evaluate handling of borderline content and linguistic traps.
    grader: graders.graders.grade_task_3
  - id: multi_turn_contextual_harassment
    difficulty: elite
    description: Detect harassment that relies on conversational history/context.
    grader: graders.graders.grade_task_4
observation_space:
  post: string
  context: string
  step: integer
  task_id: integer
action_space:
  decision: "remove | keep"
  confidence: "float 0.0-1.0"
  reason: string
reward_range: [0.0, 1.0]